[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemmainfer"
version = "0.1.0"
description = "High-performance inference engine for Gemma models inspired by DeepSeek DeepInfer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "accelerate>=0.28.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "ninja>=1.11.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gemmainfer*"]
